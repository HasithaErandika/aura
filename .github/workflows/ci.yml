# AURA's own CI (docs/plans/aura-git-control-plane.md, Phase 0.5): every push and pull request is
# installed from the lockfile, typechecked, linted and tested. The same commands run locally as
# `make typecheck`, `make lint` and `make test`.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm --filter web run lint

      - name: Test
        # Runtime tests create real temporary git repositories.
        run: |
          git config --global user.name "AURA CI"
          git config --global user.email "ci@aura.local"
          pnpm -r --no-bail run test
